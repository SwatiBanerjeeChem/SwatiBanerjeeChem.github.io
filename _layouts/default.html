<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-name" href="#top">{{ page.short_name }}</a>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top" class="shell">
    <section class="profile">
      <img src="{{ page.photo | relative_url }}" alt="Portrait of {{ page.profile_name }}" width="394" height="394">
      <div>
        <p class="kicker">{{ page.kicker }}</p>
        <h1>{{ page.profile_name }}</h1>
        <p class="role">{{ page.role }}</p>
        <p class="affiliation">{{ page.affiliation }}</p>
        <div class="profile-links">
          <a href="mailto:{{ page.email }}">Email</a>
          <a href="{{ page.github }}">GitHub</a>
          <a href="{{ page.linkedin }}">LinkedIn</a>
          <a href="{{ page.orcid }}">ORCID</a>
          <a href="{{ '/swati_banerjee_detailed_cv.docx' | relative_url }}">CV</a>
        </div>
      </div>
    </section>

    <article class="content">
      {{ content }}
    </article>
  </main>

  <footer>
    <div class="shell">© {{ 'now' | date: '%Y' }} {{ page.profile_name }}</div>
  </footer>
</body>
</html>
